        // ===== Category Overview Page =====
        function showCategoryOverview(catName) {
            clearSidebarActive();
            var catMeta = (typeof CATEGORY_META !== 'undefined' && CATEGORY_META[catName]) || {};

            var subs = {};
            KNOWLEDGE_DATA.forEach(function(kp) {
                if (kp.category !== catName) return;
                if (!subs[kp.subcategory]) subs[kp.subcategory] = {};
                var ssub = kp.subSubcategory || '';
                if (!subs[kp.subcategory][ssub]) subs[kp.subcategory][ssub] = [];
                subs[kp.subcategory][ssub].push(kp);
            });

            var html = '<div class="category-overview">';
            html += '<h1>' + escHtml(catName) + '</h1>';

            if (catMeta.nature) {
                html += '<span class="category-nature-badge">' + escHtml(catMeta.nature) + '</span>';
            }
            if (catMeta.description) {
                html += '<p class="category-overview-desc">' + escHtml(catMeta.description) + '</p>';
            }
            if (catMeta.problemDomain) {
                html += '<p class="category-overview-domain"><strong>问题领域：</strong>' + escHtml(catMeta.problemDomain) + '</p>';
            }

            Object.keys(subs).sort().forEach(function(subName) {
                var subKey = catName + '|' + subName;
                var subMeta = (typeof SUBCATEGORY_META !== 'undefined' && SUBCATEGORY_META[subKey]) || {};
                var ssubs = subs[subName];
                var subCount = Object.values(ssubs).reduce(function(s, arr) { return s + arr.length; }, 0);

                html += '<div class="subcategory-block">';
                html += '<div class="subcategory-block-title">' + escHtml(subName);
                html += ' <span style="color:var(--text-secondary);font-size:0.75rem;font-weight:400;">(' + subCount + ' 个知识点)</span></div>';
                if (subMeta.description) {
                    html += '<p class="subcategory-block-desc">' + escHtml(subMeta.description) + '</p>';
                }
                html += '<div class="subcategory-kp-grid">';
                var flatKps = [];
                var ssubGroups = [];
                Object.keys(ssubs).sort().forEach(function(ssub) {
                    if (ssub) {
                        ssubGroups.push({ name: ssub, items: ssubs[ssub] });
                    } else {
                        flatKps = flatKps.concat(ssubs[ssub]);
                    }
                });

                // 没有小分类的知识点直接铺在子分类网格里
                flatKps.forEach(function(kp) {
                    html += renderKpCard(kp);
                });

                // 有小分类的按小分类成块，并接线 SUBSUBCATEGORY_META 的说明
                ssubGroups.forEach(function(group) {
                    var ssubMeta = (typeof SUBSUBCATEGORY_META !== 'undefined' &&
                        SUBSUBCATEGORY_META[subKey + '|' + group.name]) || {};
                    html += '<div class="subsubcategory-block">';
                    html += '<div class="subsubcategory-block-title">' + escHtml(group.name);
                    html += ' <span class="subsubcategory-block-count">' + group.items.length + ' 个</span></div>';
                    if (ssubMeta.description) {
                        html += '<p class="subsubcategory-block-desc">' + escHtml(ssubMeta.description) + '</p>';
                    }
                    html += '<div class="subsubcategory-block-grid">';
                    group.items.forEach(function(kp) {
                        html += renderKpCard(kp);
                    });
                    html += '</div></div>';
                });
                html += '</div></div>';
            });

            html += '</div>';
            contentEl.innerHTML = html;
            contentEl.scrollTop = 0;

            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('open');
            }
        }

        // ===== Mode Switch =====
        function switchMode(mode) {
            if (mode === currentMode) return;
            currentMode = mode;
            document.getElementById('mode-kp').classList.toggle('active', mode === 'kp');
            document.getElementById('mode-prob').classList.toggle('active', mode === 'prob');
            searchInput.value = '';
            selectedTags.clear();
            renderTagFilter();
            updateFooter();
            if (mode === 'kp') {
                buildSidebar();
                searchInput.placeholder = '搜索知识点... (按 / 聚焦)';
                showCatalog();
            } else {
                buildProblemSidebar();
                searchInput.placeholder = '搜索题目... (按 / 聚焦)';
                showProblemCatalog();
            }
        }

        function updateFooter() {
            var count, label;
            if (currentMode === 'kp') {
                count = KNOWLEDGE_DATA.length;
                label = '个知识点';
            } else {
                count = (typeof PROBLEMS_DATA !== 'undefined') ? PROBLEMS_DATA.length : 0;
                label = '个题目';
            }
            // 整块重写，避免再引用被 innerHTML 替换掉的旧节点
            document.querySelector('.sidebar-footer').innerHTML =
                '<span id="kp-count">' + count + '</span> ' + label;
        }

        // ===== Build Problem Sidebar =====
        function buildProblemSidebar(filter) {
            filter = filter || '';
            var hasFilter = filter || selectedTags.size > 0;
            if (typeof PROBLEMS_DATA === 'undefined' || PROBLEMS_DATA.length === 0) {
                sidebarNav.innerHTML = '<div class="no-results">暂无题目，请添加题目到 problems/ 目录</div>';
                return;
            }

            var tree = {};

            var q = filter ? filter.toLowerCase() : '';

            PROBLEMS_DATA.forEach(function(prob) {
                if (!matchesTagFilter(prob)) return;
                // 搜索命中范围：标题 / ID / 分类 / OJ / 题号 / 难度 / 标签 / 正文
                if (q && searchBlob(prob).indexOf(q) < 0) return;
                var cat = prob.category || '未分类';
                if (!tree[cat]) tree[cat] = [];
                tree[cat].push(prob);
            });

            var html = '';
            var cats = Object.keys(tree).sort();

            if (cats.length === 0 && filter) {
                html = '<div class="no-results">未找到匹配的题目</div>';
                sidebarNav.innerHTML = html;
                return;
            }

            cats.forEach(function(cat) {
                var probs = tree[cat];
                var expanded = hasFilter ? ' expanded' : '';

                html += '<div class="category' + expanded + '">';
                html += '<div class="category-header" onclick="this.parentElement.classList.toggle(\'expanded\')">';
                html += '<span class="chevron">▼</span>';
                html += '<span class="category-name">' + escHtml(cat) + '</span>';
                html += '<span class="category-count">' + probs.length + '</span>';
                html += '</div>';
                html += '<div class="category-body">';

                probs.forEach(function(prob) {
                    var active = currentId === prob.id ? ' active' : '';
                    var label = prob.title;
                    if (prob.difficulty) {
                        var diffIcon = prob.difficulty === '简单' ? '🟢' : (prob.difficulty === '中等' ? '🟡' : (prob.difficulty === '困难' ? '🔴' : '⚪'));
                        label = diffIcon + ' ' + label;
                    }
                    html += '<div class="kp-item' + active + '" onclick="selectProblem(\'' + prob.id + '\')" title="' + escAttr(prob.title) + '">' + escHtml(label) + '</div>';
                });

                html += '</div></div>';
            });

            sidebarNav.innerHTML = html;
        }

        // ===== Select Problem =====
        function selectProblem(id) {
            var prob = PROBLEMS_DATA.find(function(p) { return p.id === id; });
            if (!prob) return;
            document.title = prob.title + ' · 算法知识点查询系统';

            currentId = id;

            // Meta bar
            var diffClass = 'badge-difficulty-medium';
            if (prob.difficulty === '简单') diffClass = 'badge-difficulty-easy';
            else if (prob.difficulty === '困难') diffClass = 'badge-difficulty-hard';

            var metaHtml = '<div class="meta-bar">';
            metaHtml += '<span class="badge ' + diffClass + '"> difficulty: ' + escHtml(prob.difficulty) + '</span>';
            if (prob.oj) {
                metaHtml += '<span class="badge badge-oj">' + escHtml(prob.oj) + '</span>';
            }
            if (prob.problemId) {
                metaHtml += '<span class="badge badge-pid">' + escHtml(prob.problemId) + '</span>';
            }
            metaHtml += '<span class="badge badge-time">⏱ ' + escHtml(prob.timeComplexity) + '</span>';
            metaHtml += '<span class="badge badge-space">💾 ' + escHtml(prob.spaceComplexity) + '</span>';
            if (prob.tags && Array.isArray(prob.tags)) {
                prob.tags.forEach(function(tag) {
                    metaHtml += '<span class="tag">' + escHtml(tag) + '</span>';
                });
            }
            metaHtml += '</div>';

            // Render content: 三步法保护 LaTeX（实现见 renderMarkdownWithMath）
            var contentHtml = '';
            try {
                contentHtml = renderMarkdownWithMath(prob.content);
            } catch(e) {
                contentHtml = '<p>内容渲染出错: ' + escHtml(e.message) + '</p>';
            }

            // Code section
            var codeHtml = '';
            if (prob.codePath && typeof CODE_DATA !== 'undefined' && CODE_DATA[prob.codePath]) {
                codeHtml = '<div class="code-section">' +
                    '<div class="code-header">' +
                    '<span class="code-filename">📄 ' + escHtml(prob.codePath.split('\\').pop()) + '</span>' +
                    '<button class="copy-btn" onclick="copyCode(this)">📋 复制</button>' +
                    '</div>' +
                    '<pre><code class="language-cpp" id="code-block"></code></pre>' +
                    '</div>';
            }

            // Nav buttons
            var idx = PROBLEMS_DATA.findIndex(function(p) { return p.id === id; });
            var navHtml = '<div class="nav-buttons">';
            if (idx > 0) {
                navHtml += '<button class="nav-btn nav-prev" onclick="selectProblem(\'' + PROBLEMS_DATA[idx-1].id + '\')" title="' + escAttr(PROBLEMS_DATA[idx-1].title) + '">← ' + escHtml(PROBLEMS_DATA[idx-1].title) + '</button>';
            } else {
                navHtml += '<span></span>';
            }
            if (idx < PROBLEMS_DATA.length - 1) {
                navHtml += '<button class="nav-btn nav-next" onclick="selectProblem(\'' + PROBLEMS_DATA[idx+1].id + '\')" title="' + escAttr(PROBLEMS_DATA[idx+1].title) + '">' + escHtml(PROBLEMS_DATA[idx+1].title) + ' →</button>';
            } else {
                navHtml += '<span></span>';
            }
            navHtml += '</div>';

            // Assemble
            contentEl.innerHTML =
                '<article class="article">' +
                '<h1>' + escHtml(prob.title) + '</h1>' +
                metaHtml +
                '<div class="markdown-body">' + contentHtml + '</div>' +
                codeHtml +
                navHtml +
                '</article>';

            // Set code content safely
            var codeBlock = document.getElementById('code-block');
            if (codeBlock && prob.codePath && CODE_DATA[prob.codePath]) {
                codeBlock.textContent = CODE_DATA[prob.codePath];
                hljs.highlightElement(codeBlock);
            }

            // Highlight code blocks in content
            contentEl.querySelectorAll('.markdown-body pre code').forEach(function(block) {
                hljs.highlightElement(block);
            });

            // Render math fallback
            try {
                renderMathInElement(contentEl, {
                    delimiters: [
                        {left: '\\(', right: '\\)', display: false},
                        {left: '\\[', right: '\\]', display: true}
                    ],
                    ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code', 'option', 'annotation', 'math'],
                    throwOnError: false,
                    errorColor: '#cc0000'
                });
            } catch(e) {
                console.warn('KaTeX render error:', e);
            }

            // Update URL
            location.hash = id;

            // Update sidebar active
            buildProblemSidebar(searchInput.value);
            revealActiveInSidebar();

            // Scroll to top
            contentEl.scrollTop = 0;

            // Close sidebar on mobile
            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('open');
            }
        }

        // ===== Problem Catalog Page =====
        function showProblemCatalog() {
            clearSidebarActive();

            if (typeof PROBLEMS_DATA === 'undefined' || PROBLEMS_DATA.length === 0) {
                contentEl.innerHTML = '<div class="placeholder">暂无题目<br><span style="font-size:0.85rem;margin-top:0.5rem;display:block;">将题目 .md 文件放入 problems/ 目录后运行 node build.js</span></div>';
                return;
            }

            // Build category tree
            var tree = {};
            PROBLEMS_DATA.forEach(function(prob) {
                var cat = prob.category || '未分类';
                if (!tree[cat]) tree[cat] = [];
                tree[cat].push(prob);
            });

            var cats = Object.keys(tree).sort();
            var totalProb = PROBLEMS_DATA.length;

            // Difficulty stats
            var easyCount = PROBLEMS_DATA.filter(function(p) { return p.difficulty === '简单'; }).length;
            var medCount = PROBLEMS_DATA.filter(function(p) { return p.difficulty === '中等'; }).length;
            var hardCount = PROBLEMS_DATA.filter(function(p) { return p.difficulty === '困难'; }).length;
            var otherCount = PROBLEMS_DATA.filter(function(p) { return p.difficulty !== '简单' && p.difficulty !== '中等' && p.difficulty !== '困难'; }).length;

            var html = '<div class="catalog-page">';
            document.title = '题目专辑 · 算法知识点查询系统';
            html += '<h1>📝 题目专辑</h1>';
            html += '<div class="catalog-desc">按分类浏览所有题目，点击题目即可查看题解详情。</div>';

            // Legend
            html += '<div class="catalog-legend">';
            html += '<span class="legend-item"><span class="legend-dot">🟢</span> 简单</span>';
            html += '<span class="legend-item"><span class="legend-dot">🟡</span> 中等</span>';
            html += '<span class="legend-item"><span class="legend-dot">🔴</span> 困难</span>';
            html += '<span class="legend-item"><span class="legend-dot">⚪</span> 其他（提高 / 普及+ 等）</span>';
            html += '</div>';

            // Stats
            html += '<div class="catalog-stats">';
            html += '<div class="catalog-stat"><div class="catalog-stat-num">' + totalProb + '</div><div class="catalog-stat-label">题目总数</div></div>';
            html += '<div class="catalog-stat"><div class="catalog-stat-num">' + cats.length + '</div><div class="catalog-stat-label">分类</div></div>';
            html += '<div class="catalog-stat"><div class="catalog-stat-num" style="color:#166534;">' + easyCount + '</div><div class="catalog-stat-label">🟢 简单</div></div>';
            html += '<div class="catalog-stat"><div class="catalog-stat-num" style="color:#854d0e;">' + medCount + '</div><div class="catalog-stat-label">🟡 中等</div></div>';
            html += '<div class="catalog-stat"><div class="catalog-stat-num" style="color:#991b1b;">' + hardCount + '</div><div class="catalog-stat-label">🔴 困难</div></div>';
            html += '<div class="catalog-stat"><div class="catalog-stat-num" style="color:#6b7280;">' + otherCount + '</div><div class="catalog-stat-label">⚪ 其他</div></div>';
            html += '</div>';

            // Category sections
            cats.forEach(function(cat) {
                var probs = tree[cat];
                html += '<div class="catalog-category">';
                html += '<div class="catalog-category-header" onclick="this.parentElement.classList.toggle(\'expanded\')">';
                html += '<div class="catalog-category-header-left">';
                html += '<span class="catalog-category-chevron">▶</span>';
                html += '<span class="catalog-category-name">' + escHtml(cat) + '</span>';
                html += '<span class="catalog-category-count">' + probs.length + '</span>';
                html += '</div>';
                html += '</div>';
                html += '<div class="catalog-category-body">';
                html += '<div class="catalog-sub-grid">';
                html += '<div class="catalog-subcard" style="grid-column: 1 / -1;">';
                html += '<ul class="catalog-kp-list">';
                probs.forEach(function(prob) {
                    var diffIcon = prob.difficulty === '简单' ? '🟢' : (prob.difficulty === '中等' ? '🟡' : (prob.difficulty === '困难' ? '🔴' : '⚪'));
                    var ojLabel = prob.oj ? ' [' + escHtml(prob.oj) + (prob.problemId ? ' ' + escHtml(prob.problemId) : '') + ']' : '';
                    html += '<li class="catalog-kp-item" onclick="selectProblem(\'' + prob.id + '\')" title="' + escAttr(prob.title) + '">' +
                        diffIcon + ' ' + escHtml(prob.title) + '<span style="color:var(--text-secondary);font-size:0.75rem;">' + ojLabel + '</span></li>';
                });
                html += '</ul></div>';
                html += '</div></div></div>';
            });

            html += '</div>';
            contentEl.innerHTML = html;
            contentEl.scrollTop = 0;

            document.getElementById('sidebar').classList.remove('open');
        }

        // ===== Toggle Dark =====
        function toggleDark() {
            isDark = !isDark;
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
            document.getElementById('theme-icon').textContent = isDark ? '☀️' : '🌙';
        }

        // ===== Keyboard =====
        function handleKeyboard(e) {
            // '/' focuses search
            if (e.key === '/' && document.activeElement !== searchInput) {
                e.preventDefault();
                searchInput.focus();
                return;
            }
            // Escape clears search
            if (e.key === 'Escape' && document.activeElement === searchInput) {
                searchInput.value = '';
                if (currentMode === 'kp') buildSidebar();
                else buildProblemSidebar();
                searchInput.blur();
                return;
            }
            // Alt+Left/Right for prev/next
            if (e.altKey && currentId) {
                if (currentMode === 'kp') {
                    var idx = KNOWLEDGE_DATA.findIndex(function(k) { return k.id === currentId; });
                    if (e.key === 'ArrowLeft' && idx > 0) {
                        e.preventDefault();
                        selectKP(KNOWLEDGE_DATA[idx-1].id);
                    }
                    if (e.key === 'ArrowRight' && idx < KNOWLEDGE_DATA.length - 1) {
                        e.preventDefault();
                        selectKP(KNOWLEDGE_DATA[idx+1].id);
                    }
                } else if (currentMode === 'prob' && typeof PROBLEMS_DATA !== 'undefined') {
                    var idx = PROBLEMS_DATA.findIndex(function(p) { return p.id === currentId; });
                    if (e.key === 'ArrowLeft' && idx > 0) {
                        e.preventDefault();
                        selectProblem(PROBLEMS_DATA[idx-1].id);
                    }
                    if (e.key === 'ArrowRight' && idx < PROBLEMS_DATA.length - 1) {
                        e.preventDefault();
                        selectProblem(PROBLEMS_DATA[idx+1].id);
                    }
                }
            }
        }

        // ===== Helpers =====
        function renderKpCard(kp) {
            return '<div class="subcategory-kp-card" onclick="selectKP(\'' + kp.id + '\')" title="' + escAttr(kp.title) + '">' + escHtml(kp.title) + '</div>';
        }

        function escHtml(text) {
            if (!text) return '';
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function escAttr(text) {
            if (!text) return '';
            return text.replace(/'/g, '&#39;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // ===== Start =====
        init();
    </script>



    <!-- Tag Filter Modal -->
    <div class="tag-modal-overlay" id="tag-modal-overlay" onclick="closeTagModal()">
        <div class="tag-modal" onclick="event.stopPropagation()">
            <div class="tag-modal-header">
                <span class="tag-modal-title">🏷️ 选择标签</span>
                <span class="tag-modal-close" onclick="closeTagModal()">✕</span>
            </div>
            <div class="tag-modal-body" id="tag-modal-body"></div>
            <div class="tag-modal-footer">
                <div class="tag-modal-selected">
                    <span class="tag-modal-selected-label">已选：</span>
                    <span class="tag-modal-selected-list" id="tag-modal-selected-list">无</span>
                </div>
                <div class="tag-modal-mode-switch">
                    <span class="tag-modal-mode-label">模式：</span>
                    <button class="tag-modal-mode-btn" id="modal-mode-inter" onclick="setModalTagMode('intersection')">交集</button>
                    <button class="tag-modal-mode-btn" id="modal-mode-union" onclick="setModalTagMode('union')">并集</button>
                </div>
                <div class="tag-modal-actions">
                    <button class="tag-modal-btn tag-modal-btn-clear" onclick="tempSelectedTags.clear(); renderTagModal();">全部清除</button>
                    <button class="tag-modal-btn tag-modal-btn-ok" onclick="applyTagFilter()">确定</button>
                </div>
            </div>
        </div>
    </div>

</body></html>
